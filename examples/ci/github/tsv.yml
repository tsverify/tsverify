# Example GitHub Actions workflow for tsv. Copy it to .github/workflows/tsv.yml in your repository.
#
# - `check`: runs `tsv check --format sarif` and uploads the result to GitHub code scanning, so
#   findings show up as annotations on the PR and in the Security tab. Whether findings fail the
#   job is up to you: set TSV_MODE below (tsv itself never decides; see docs/workflows.md).
# - `diff` (pull requests only): runs `tsv diff` against the PR's base branch and posts the
#   Markdown as one PR comment, updated in place on every push ("sticky" comment).
#
# Exit codes: 0 ok · 1 violations · 2 invalid input (bad spec, broken link, bad ref) · 3 internal.
name: tsv

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # advisory: never fail on findings (they are still uploaded and commented).
  # blocking: fail the job on any violation (exit 1).
  # enforced: fail only on violations in specs marked `enforced: true`.
  # Invalid input (exit 2) and internal errors (exit 3) fail the job in every mode.
  TSV_MODE: advisory

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # needed by upload-sarif
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Your project's own dependencies: tsv type-checks your code, so it needs them installed.
      - run: npm ci

      # ─── PLACEHOLDER ───────────────────────────────────────────────────────────────────────
      # tsv is not published yet. Once it is, replace this step with something like
      #   npm install --global <tsv package>@<version>
      # (or add it as a devDependency and call it through `npx tsv`).
      - name: Install tsv (PLACEHOLDER, tsv is not published yet)
        run: |
          echo "::error::Replace the 'Install tsv' step in .github/workflows/tsv.yml: tsv is not published yet."
          exit 1
      # ───────────────────────────────────────────────────────────────────────────────────────

      # Run from the repository root: SARIF URIs are relative to the cwd, and code scanning
      # resolves them against the root of the checkout.
      - name: tsv check (SARIF)
        id: check
        run: |
          set +e
          tsv check --format sarif > tsv.sarif
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          # 1 (violations) is decided by the gate below; 2 and 3 mean the run itself is unusable.
          if [ "$code" -ge 2 ]; then exit "$code"; fi
          exit 0

      # Upload even when the gate fails, so the findings are visible either way. On pull requests
      # from forks the token cannot write security events; the upload is then skipped.
      - name: Upload SARIF to code scanning
        if: always() && steps.check.outputs.exit-code != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tsv.sarif
          category: tsv

      - name: Gate (TSV_MODE)
        env:
          CHECK_EXIT: ${{ steps.check.outputs.exit-code }}
        run: |
          case "$TSV_MODE" in
            advisory) exit 0 ;;
            blocking) exit "$CHECK_EXIT" ;;
            # Re-checks only the enforced specs; an invalid spec still fails (exit 2).
            enforced) tsv check --enforced-only ;;
            *) echo "::error::unknown TSV_MODE '$TSV_MODE'"; exit 2 ;;
          esac

  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the comment
    steps:
      - uses: actions/checkout@v4
        with:
          # tsv diff reads the base branch's specs with the local git: fetch the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ─── PLACEHOLDER: same install step as in `check` ──────────────────────────────────────
      - name: Install tsv (PLACEHOLDER, tsv is not published yet)
        run: |
          echo "::error::Replace the 'Install tsv' step in .github/workflows/tsv.yml: tsv is not published yet."
          exit 1
      # ───────────────────────────────────────────────────────────────────────────────────────

      # Markdown with a Mermaid diagram per changed behavior. Exit 0 whether or not anything
      # changed; 2 if a spec on either side is invalid or the base ref is missing.
      - name: tsv diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: tsv diff --base "origin/$BASE_REF" > tsv-diff.md

      # The Markdown starts with `<!-- tsv-diff -->`. Find the comment carrying that marker and
      # edit it, so the PR keeps one up-to-date behavior diff instead of one comment per push.
      # It is updated even when nothing changed, so an outdated diff never lingers.
      - name: Post or update the behavior diff comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- tsv-diff -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@tsv-diff.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@tsv-diff.md > /dev/null
          fi
