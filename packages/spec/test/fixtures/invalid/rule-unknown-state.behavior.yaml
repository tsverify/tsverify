# A rule references a state that is not declared.
behavior: Mini
entity:
  name: Order
  state: status
  states: [paid, shipped, refunded]
  initial: paid
actors:
  admin: { trust: internal }
transitions:
  ship:
    from: paid
    to: shipped
    by: admin
  refund:
    from: paid
    to: refunded
    by: admin
    effects: [stripe.refund]
rules:
  - name: Shipped orders are never refunded
    never: status == shiped and count(effect stripe.refund) > 0
