# A rule counts an effect that no transition declares.
behavior: Mini
entity:
  name: Order
  state: status
  states: [paid, refunded]
  initial: paid
actors:
  admin: { trust: internal }
transitions:
  refund:
    from: paid
    to: refunded
    by: admin
    effects: [stripe.refund]
rules:
  - name: Refund once
    always: 'count(effect stripe.refnd) <= 1'
