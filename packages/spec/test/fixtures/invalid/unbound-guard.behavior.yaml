# Some guards are bound, so every guard used must be bound; `owner` is not.
behavior: Mini
entity:
  name: Order
  state: status
  states: [draft, paid, refunded]
  initial: draft
actors:
  customer: { trust: untrusted }
  admin: { trust: authenticated, requires: role( admin ) }
transitions:
  pay:
    from: draft
    to: paid
    by: customer
    requires: [owner]
  refund:
    from: paid
    to: refunded
    by: admin
bindings:
  guards:
    role(admin): src/auth/guards.ts#requireRole("admin")
